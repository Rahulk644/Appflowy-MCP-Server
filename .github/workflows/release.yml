name: Release packages

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  compatibility:
    uses: ./.github/workflows/compatibility.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Match the release tag to the package version
      id: metadata
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        release_version=$(python scripts/release_metadata.py --tag "$RELEASE_TAG")
        echo "version=$release_version" >> "$GITHUB_OUTPUT"

  pypi:
    # PyPI is explicitly deferred for this release, regardless of repository settings.
    # Remove the false guard only after the maintainer chooses to publish to PyPI.
    if: false && vars.ENABLE_PYPI_PUBLISH == 'true'
    needs: [verify, compatibility, version]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: dist-ubuntu-latest-3.12
        path: dist/
    - uses: pypa/gh-action-pypi-publish@release/v1

  assets:
    needs: [verify, compatibility, version]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - uses: actions/download-artifact@v4
      with:
        name: dist-ubuntu-latest-3.12
        path: dist/
    - name: Attach gated distributions without replacing published assets
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: python scripts/release_artifacts.py assets

  container:
    needs: [verify, compatibility, version]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Check whether the immutable version already exists
      id: existing
      run: python scripts/release_artifacts.py image
    - uses: docker/setup-qemu-action@v3
      if: steps.existing.outputs.exists != 'true'
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - name: Select the latest stable release alias
      id: latest
      env:
        GH_TOKEN: ${{ github.token }}
        GH_REPO: ${{ github.repository }}
        RELEASE_TAG: ${{ github.event.release.tag_name }}
        IS_PRERELEASE: ${{ github.event.release.prerelease }}
      run: |
        promote_latest=false
        if [ "$IS_PRERELEASE" != true ]; then
          latest_tag=$(gh api "repos/$GH_REPO/releases/latest" --jq .tag_name)
          if [ "$latest_tag" = "$RELEASE_TAG" ]; then promote_latest=true; fi
        fi
        echo "promote=$promote_latest" >> "$GITHUB_OUTPUT"
    - name: Verify an existing image belongs to this release commit
      if: steps.existing.outputs.exists == 'true'
      env:
        IMAGE: ${{ steps.existing.outputs.image }}
      run: |
        docker pull "$IMAGE"
        revision=$(docker image inspect --format '{{ index .Config.Labels "org.opencontainers.image.revision" }}' "$IMAGE")
        test "$revision" = "$GITHUB_SHA"
    - name: Recover the mutable latest alias without rebuilding the version
      if: steps.existing.outputs.exists == 'true' && steps.latest.outputs.promote == 'true'
      env:
        IMAGE: ${{ steps.existing.outputs.image }}
      run: docker buildx imagetools create --tag "${IMAGE%:*}:latest" "$IMAGE"
    - uses: docker/metadata-action@v5
      if: steps.existing.outputs.exists != 'true'
      id: meta
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=raw,value=${{ needs.version.outputs.version }}
          type=raw,value=latest,enable=${{ steps.latest.outputs.promote == 'true' }}
    - uses: docker/build-push-action@v6
      if: steps.existing.outputs.exists != 'true'
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  registry:
    needs: [container]
    uses: ./.github/workflows/publish-registry.yml
    with:
      release_tag: ${{ github.event.release.tag_name }}
    permissions:
      contents: read
      id-token: write
