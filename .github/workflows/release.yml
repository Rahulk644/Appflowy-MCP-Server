name: Release packages

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  compatibility:
    uses: ./.github/workflows/compatibility.yml

  version:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Match the release tag to the package version
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        python - <<'PY'
        import os
        import pathlib
        import tomllib
        version = tomllib.loads(pathlib.Path("pyproject.toml").read_text())["project"]["version"]
        import json
        registry = json.loads(pathlib.Path("server.json").read_text())
        if registry["version"] != version or not registry["packages"][0]["identifier"].endswith(":" + version):
            raise SystemExit("server.json and pyproject.toml versions must match")
        if os.environ["RELEASE_TAG"] != f"v{version}":
            raise SystemExit("Release tag must be v followed by the package version")
        PY

  pypi:
    # PyPI is explicitly deferred for this release, regardless of repository settings.
    # Remove the false guard only after the maintainer chooses to publish to PyPI.
    if: false && vars.ENABLE_PYPI_PUBLISH == 'true'
    needs: [verify, compatibility, version]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: dist-ubuntu-latest-3.12
        path: dist/
    - uses: pypa/gh-action-pypi-publish@release/v1

  container:
    needs: [verify, compatibility, version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-qemu-action@v3
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/metadata-action@v5
      id: meta
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=semver,pattern={{version}}
          type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
    - uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  registry:
    needs: [container]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
    - uses: actions/checkout@v4
    - uses: sigstore/cosign-installer@v3
    - name: Download and verify MCP publisher
      env:
        MCP_PUBLISHER_VERSION: v1.8.8
      run: |
        archive=mcp-publisher_linux_amd64.tar.gz
        base="https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION"
        curl --fail --location --silent --show-error --output "$archive" "$base/$archive"
        curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base/$archive.sigstore.json"
        cosign verify-blob --bundle "$archive.sigstore.json" \
          --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/$MCP_PUBLISHER_VERSION" \
          --certificate-oidc-issuer https://token.actions.githubusercontent.com "$archive"
        tar xzf "$archive" mcp-publisher
    - name: Verify public image access
      run: docker pull "ghcr.io/rahulk644/appflowy-mcp-server:${GITHUB_REF_NAME#v}"
    - name: Authenticate and publish metadata
      run: |
        ./mcp-publisher login github-oidc
        ./mcp-publisher publish
