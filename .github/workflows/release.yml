name: Release packages

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  verify:
    uses: ./.github/workflows/ci.yml

  compatibility:
    uses: ./.github/workflows/compatibility.yml

  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.metadata.outputs.version }}
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Match the release tag to the package version
      id: metadata
      env:
        RELEASE_TAG: ${{ github.event.release.tag_name }}
      run: |
        release_version=$(python scripts/release_metadata.py --tag "$RELEASE_TAG")
        echo "version=$release_version" >> "$GITHUB_OUTPUT"

  pypi:
    # PyPI is explicitly deferred for this release, regardless of repository settings.
    # Remove the false guard only after the maintainer chooses to publish to PyPI.
    if: false && vars.ENABLE_PYPI_PUBLISH == 'true'
    needs: [verify, compatibility, version]
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
    - uses: actions/download-artifact@v4
      with:
        name: dist-ubuntu-latest-3.12
        path: dist/
    - uses: pypa/gh-action-pypi-publish@release/v1

  container:
    needs: [verify, compatibility, version]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
    - uses: actions/checkout@v4
    - uses: docker/setup-qemu-action@v3
    - uses: docker/setup-buildx-action@v3
    - uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    - uses: docker/metadata-action@v5
      id: meta
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=raw,value=${{ needs.version.outputs.version }}
          type=raw,value=latest,enable=${{ !github.event.release.prerelease }}
    - uses: docker/build-push-action@v6
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: true
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  registry:
    needs: [container]
    uses: ./.github/workflows/publish-registry.yml
    with:
      release_tag: ${{ github.event.release.tag_name }}
    permissions:
      contents: read
      id-token: write
