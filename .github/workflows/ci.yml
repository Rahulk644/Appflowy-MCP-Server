name: CI

on:
  workflow_call:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"
    - name: Check release metadata
      run: python scripts/release_metadata.py
    - name: Install development dependencies
      run: pip install -e '.[dev]'
    - name: Lint
      run: ruff check .
    - name: Format check
      run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Set up Python
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e '.[dev]'
    - name: Run tests
      run: python -m pytest -q

  package:
    name: Package (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12"]
        include:
          - os: windows-latest
            python: "3.12"
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: ${{ matrix.python }}
    - name: Build distributions
      run: |
        python -m pip install -e '.[dev]'
        python -m build
        python -m twine check dist/*
    - name: Test installation outside the checkout
      run: python scripts/check_package.py
    - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
      with:
        name: dist-${{ matrix.os }}-${{ matrix.python }}
        path: dist/
    - name: Download the uploaded distributions
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
      with:
        name: dist-${{ matrix.os }}-${{ matrix.python }}
        path: ${{ runner.temp }}/appflowy-downloaded-dist
    - name: Verify distribution artifact round trip
      shell: python
      env:
        APPFLOWY_DOWNLOADED_DIST: ${{ runner.temp }}/appflowy-downloaded-dist
      run: |
        import hashlib
        import os
        from pathlib import Path
        def digests(directory):
            return {p.name: hashlib.sha256(p.read_bytes()).hexdigest()
                    for p in Path(directory).iterdir() if p.is_file()}
        expected = digests('dist')
        assert expected and expected == digests(os.environ['APPFLOWY_DOWNLOADED_DIST'])
        print('Distribution artifact round trip verified')

  container:
    runs-on: ubuntu-latest
    needs: [lint, test, package]
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
      with:
        python-version: "3.12"
    - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
    - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
      with:
        context: .
        load: true
        tags: appflowy-mcp:smoke
        cache-from: type=gha
        cache-to: type=gha,mode=max
    - name: Test MCP from the installed container
      run: |
        python -m pip install .
        python scripts/smoke_mcp.py --docker-image appflowy-mcp:smoke
        python scripts/smoke_mcp.py --docker-image appflowy-mcp:smoke --transport streamable-http
