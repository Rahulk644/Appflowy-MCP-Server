name: CI

on:
  workflow_call:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Check release metadata
      run: python scripts/release_metadata.py
    - name: Install development dependencies
      run: pip install -e '.[dev]'
    - name: Lint
      run: ruff check .
    - name: Format check
      run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e '.[dev]'
    - name: Run tests
      run: python -m pytest -q

  package:
    name: Package (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12"]
        include:
          - os: windows-latest
            python: "3.12"
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
    - name: Build distributions
      run: |
        python -m pip install -e '.[dev]'
        python -m build
        python -m twine check dist/*
    - name: Test installation outside the checkout
      run: python scripts/check_package.py
    - uses: actions/upload-artifact@v4
      with:
        name: dist-${{ matrix.os }}-${{ matrix.python }}
        path: dist/

  container:
    runs-on: ubuntu-latest
    needs: [lint, test, package]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - uses: docker/setup-buildx-action@v3
    - uses: docker/build-push-action@v6
      with:
        context: .
        load: true
        tags: appflowy-mcp:smoke
        cache-from: type=gha
        cache-to: type=gha,mode=max
    - name: Test MCP from the installed container
      run: |
        python -m pip install .
        python scripts/smoke_mcp.py --docker-image appflowy-mcp:smoke
        python scripts/smoke_mcp.py --docker-image appflowy-mcp:smoke --transport streamable-http
