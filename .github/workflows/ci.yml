name: CI

on:
  workflow_call:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install ruff
      # Pinned deliberately: an unpinned ruff silently adopts new rules on release,
      # so a build that passed yesterday fails today with no code change. Bump this
      # on purpose, with the fixes in the same commit.
      run: pip install ruff==0.16.1
    - name: Lint
      run: ruff check .
    - name: Format check
      run: ruff format --check .

  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pytest pytest-asyncio
    - name: Run tests
      run: pytest -q

  package:
    name: Package (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.11", "3.12"]
        include:
          - os: windows-latest
            python: "3.12"
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python }}
    - name: Build distributions
      run: |
        python -m pip install build twine
        python -m build
        python -m twine check dist/*
    - name: Test installation outside the checkout
      run: python scripts/check_package.py
    - uses: actions/upload-artifact@v4
      with:
        name: dist-${{ matrix.os }}-${{ matrix.python }}
        path: dist/

  container:
    runs-on: ubuntu-latest
    needs: [lint, test, package]
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - uses: docker/setup-buildx-action@v3
    - uses: docker/build-push-action@v6
      with:
        context: .
        load: true
        tags: appflowy-mcp:smoke
        cache-from: type=gha
        cache-to: type=gha,mode=max
    - name: Test MCP from the installed container
      run: |
        python -m pip install "mcp>=2.3,<3" httpx
        python scripts/smoke_mcp.py --docker-image appflowy-mcp:smoke
        python scripts/smoke_mcp.py --docker-image appflowy-mcp:smoke --transport streamable-http
