name: Publish MCP Registry metadata

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing published tag (for example v2.0.1)
        required: true
        type: string
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  registry:
    runs-on: ubuntu-latest
    steps:
    - name: Validate the published tag
      env:
        RELEASE_TAG: ${{ inputs.release_tag }}
      run: |
        [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([A-Za-z0-9.-]+)?$ ]]
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        ref: refs/tags/${{ inputs.release_tag }}
    - name: Match package and registry versions
      env:
        RELEASE_TAG: ${{ inputs.release_tag }}
      run: |
        python - <<'PY'
        import json, os, pathlib, subprocess, sys, tomllib
        script = pathlib.Path('scripts/release_metadata.py')
        if script.is_file():
            subprocess.run([sys.executable, str(script), '--tag', os.environ['RELEASE_TAG']], check=True)
        else:
            # Metadata-only recovery also supports immutable tags predating the helper.
            package = tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version']
            registry = json.loads(pathlib.Path('server.json').read_text())
            assert os.environ['RELEASE_TAG'] == 'v' + package
            assert registry['version'] == package
            assert registry['packages'][0]['identifier'] == 'ghcr.io/rahulk644/appflowy-mcp-server:' + package
        PY
    - name: Check whether this version is already published
      id: published
      run: |
        python - <<'PYTHON'
        import json, os, pathlib, urllib.error, urllib.parse, urllib.request
        expected = json.loads(pathlib.Path('server.json').read_text())
        name = urllib.parse.quote(expected['name'], safe='')
        url = f"https://registry.modelcontextprotocol.io/v0.1/servers/{name}/versions/{expected['version']}"
        published = False
        try:
            with urllib.request.urlopen(url, timeout=30) as response:
                actual = json.load(response)
            server = actual['server']
            assert server['name'] == expected['name'] and server['version'] == expected['version']
            assert server['packages'][0]['identifier'] == expected['packages'][0]['identifier']
            assert server['packages'][0]['transport'] == expected['packages'][0]['transport']
            assert actual['_meta']['io.modelcontextprotocol.registry/official']['status'] == 'active'
            published = True
        except urllib.error.HTTPError as error:
            if error.code != 404:
                raise
        with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
            output.write(f'already_published={str(published).lower()}\n')
        PYTHON
    - name: Download verified tools with bounded retries
      if: steps.published.outputs.already_published != 'true'
      env:
        COSIGN_VERSION: v2.5.2
        # Same bootstrap digest pinned by sigstore/cosign-installer v3.
        COSIGN_SHA256: bcfeae05557a9f313ee4392d2f335d0ff69ebbfd232019e3736fb04999fe1734
        MCP_PUBLISHER_VERSION: v1.8.8
      run: |
        fetch() {
          curl --fail --location --silent --show-error --retry 4 --retry-all-errors \
            --retry-delay 2 --connect-timeout 15 --max-time 120 --retry-max-time 600 \
            --output "$1" "$2"
        }
        fetch cosign "https://github.com/sigstore/cosign/releases/download/$COSIGN_VERSION/cosign-linux-amd64"
        printf '%s  cosign\n' "$COSIGN_SHA256" | sha256sum --check
        chmod +x cosign
        archive=mcp-publisher_linux_amd64.tar.gz
        base="https://github.com/modelcontextprotocol/registry/releases/download/$MCP_PUBLISHER_VERSION"
        fetch "$archive" "$base/$archive"
        fetch "$archive.sigstore.json" "$base/$archive.sigstore.json"
        ./cosign verify-blob --bundle "$archive.sigstore.json" \
          --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/$MCP_PUBLISHER_VERSION" \
          --certificate-oidc-issuer https://token.actions.githubusercontent.com "$archive"
        tar xzf "$archive" mcp-publisher
    - name: Verify anonymous image access
      env:
        RELEASE_TAG: ${{ inputs.release_tag }}
      run: docker pull "ghcr.io/rahulk644/appflowy-mcp-server:${RELEASE_TAG#v}"
    - name: Authenticate and publish metadata
      if: steps.published.outputs.already_published != 'true'
      run: |
        ./mcp-publisher login github-oidc
        ./mcp-publisher publish
