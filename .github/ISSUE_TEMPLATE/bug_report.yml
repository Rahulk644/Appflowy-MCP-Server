name: Bug Report
description: Create a report to help us improve
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Include a minimal reproduction. Redact credentials, tokens and private workspace content.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Also tell us, what did you expect to happen?
      placeholder: Tell us what you see!
    validations:
      required: true
  - type: input
    id: release
    attributes:
      label: MCP server release or commit
      placeholder: e.g., 2.0.0, image tag/digest, or main commit SHA
    validations:
      required: true
  - type: input
    id: deployment
    attributes:
      label: AppFlowy deployment and version
      placeholder: e.g., Cloud SaaS or self-hosted Cloud 0.20.5 / Web 0.20.11
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Python Version
      description: What version of Python are you using?
      placeholder: e.g., 3.12.0
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant log output
      description: Please copy and paste any relevant log output. This will be automatically formatted into code, so no need for backticks.
      render: shell
