services:
  mcp_proxy:
    image: nginx:1.28-alpine
    ports: ["127.0.0.1:18080:80"]
    volumes:
      - ${APPFLOWY_MCP_PROXY_CONFIG:?Set the test proxy config}:/etc/nginx/nginx.conf:ro
    depends_on:
      gotrue:
        condition: service_healthy
      appflowy_cloud:
        condition: service_healthy
      appflowy_web:
        condition: service_started
  appflowy_cloud:
    environment:
      AI_ENABLED: "false"
      APPFLOWY_BACKGROUND_INDEXER_ENABLED: "false"
      RUST_LOG: info
      NO_PROXY: localhost,127.0.0.1,::1,gotrue,appflowy_cloud,appflowy_search,minio,postgres,redis
  appflowy_worker:
    depends_on:
      appflowy_cloud:
        condition: service_healthy
    environment:
      APPFLOWY_BACKGROUND_INDEXER_ENABLED: "false"
      RUST_LOG: info
      NO_PROXY: localhost,127.0.0.1,::1,gotrue,appflowy_cloud,appflowy_search,minio,postgres,redis
  appflowy_search:
    depends_on:
      appflowy_cloud:
        condition: service_healthy
    environment:
      APPFLOWY_BACKGROUND_INDEXER_ENABLED: "false"
      RUST_LOG: info
      APPFLOWY_KEYWORD_INDEX_MAP_SIZE_BYTES: "134217728"
      NO_PROXY: localhost,127.0.0.1,::1,gotrue,appflowy_cloud,appflowy_search,minio,postgres,redis
