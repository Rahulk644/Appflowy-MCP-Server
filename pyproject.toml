[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "appflowy-mcp-server"
version = "0.1.0"
description = "Model Context Protocol (MCP) server for AppFlowy Cloud — read, build, and edit your workspace from AI agents."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "appflowy-mcp-server contributors" }]
keywords = ["mcp", "model-context-protocol", "appflowy", "ai-agents", "llm", "fastmcp"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    # Keep these bounds in sync with requirements.txt — see the comments there for
    # why mcp and pycrdt are pinned (2.0.0 dropped fastmcp; pycrdt 0.14.1 regressed
    # collab decoding).
    "mcp>=1.13,<2",
    "httpx",
    "pydantic",
    "python-dotenv",
    "fastapi",
    "uvicorn",
    "pycrdt==0.13.0",
    "markdown-it-py",
    "mdit-py-plugins",
]

[project.optional-dependencies]
dev = ["ruff==0.16.1", "pytest", "build", "twine"]

[project.scripts]
appflowy-mcp = "appflowy_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/Rahulk644/appflowy-mcp-server"
Repository = "https://github.com/Rahulk644/appflowy-mcp-server"
Issues = "https://github.com/Rahulk644/appflowy-mcp-server/issues"

[tool.hatch.build.targets.wheel]
packages = ["appflowy_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"KNOWLEDGE.md" = "appflowy_mcp/KNOWLEDGE.md"

[tool.ruff]
line-length = 88
target-version = "py310"
