[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "appflowy-mcp-server"
dynamic = ["version"]
description = "Open-source AppFlowy MCP server for AI agents: Markdown documents, typed database rows, search and import/export."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "appflowy-mcp-server contributors" }]
keywords = ["mcp", "model-context-protocol", "appflowy", "ai-agents", "llm", "async", "markdown", "docker", "self-hosted"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Libraries",
]
dependencies = [
    "mcp>=2.3,<3",
    "httpx",
    "httpx2>=2.10,<3",
    "pydantic",
    "python-dotenv",
    "fastapi",
    "uvicorn",
    # Fresh fixtures do not reproduce the historical regression; see COMPATIBILITY.md.
    "pycrdt==0.13.0",
    "markdown-it-py",
    "mdit-py-plugins",
]

[project.optional-dependencies]
dev = ["ruff==0.16.1", "pytest", "pytest-asyncio", "build", "twine"]
browser = ["playwright>=1.50,<2"]

[project.scripts]
appflowy-mcp = "appflowy_mcp.cli:main"

[project.urls]
Homepage = "https://github.com/Rahulk644/appflowy-mcp-server"
Repository = "https://github.com/Rahulk644/appflowy-mcp-server"
Issues = "https://github.com/Rahulk644/appflowy-mcp-server/issues"

[tool.hatch.version]
path = "appflowy_mcp/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["appflowy_mcp"]

[tool.hatch.build.targets.wheel.force-include]
"KNOWLEDGE.md" = "appflowy_mcp/KNOWLEDGE.md"

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.pytest.ini_options]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
